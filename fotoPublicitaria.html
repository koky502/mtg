<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Memorial MTG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #widget-container {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            align-items: flex-end;
            transform: scale(0.9) translateY(30px);
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #widget-container.visible {
            opacity: 1;
            transform: none;
        }

        /* MARCO DE LA FOTO (tamaño total visible, incluido el borde dorado) */
        .photo-frame {
            position: relative;
            width: 226px;
            height: 281px;
            border-radius: 10px 10px 4px 4px;
            overflow: visible;
            flex-shrink: 0;
            z-index: 2;
        }

        .photo-inner {
            box-sizing: border-box;
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 10px 10px 4px 4px;
            overflow: hidden;
            border: 3px solid #e6ca65;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            background: #111;
        }

        .photo-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .photo-inner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
            pointer-events: none;
        }

        /* ROSA BLANCA DECORATIVA (esquina inferior de la foto) */
        .rosa-decorativa {
            position: absolute;
            bottom: -16px;
            left: -16px;
            width: 54px;
            height: 54px;
            z-index: 4;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
            background: radial-gradient(circle, rgba(0,0,0,0.5) 40%, transparent 70%);
            border-radius: 50%;
        }

        /* BLOQUE DE TEXTO: sin saltos de línea, su ancho se adapta al texto más largo.
           Sin margin-bottom: su base queda alineada con la base del marco de la foto. */
        .text-block {
            position: relative;
            width: max-content;
            flex-shrink: 0;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.88);
            border-top: 2.5px solid #e6ca65;
            border-right: 5px solid #e6ca65;
            border-bottom: 2.5px solid #e6ca65;
            border-radius: 0 10px 10px 0;
            padding: 12px 28px 12px 30px;
            margin-left: -16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            z-index: 1;
        }

        /* Último recurso: si ni con la letra mínima cabe, se permiten dos líneas */
        .text-block.permitir-saltos {
            white-space: normal;
            width: auto;
            max-width: 1000px;
            flex-shrink: 1;
        }

        .nombre-text {
            color: #E6CA65;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.15;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            margin-bottom: 2px;
        }

        .subtitulo-text {
            color: #FFF3B3;
            font-size: 19px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.15;
            margin-bottom: 2px;
        }

        .detalle-text {
            color: #FFF3B3;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.3px;
            line-height: 1.15;
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <div class="photo-frame">
            <div class="photo-inner">
                <img id="person-photo" src="" alt="">
            </div>
            <svg class="rosa-decorativa" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <g fill="#f5f0e6" stroke="#d8cfa8" stroke-width="1.5">
                    <circle cx="50" cy="35" r="16"/>
                    <circle cx="34" cy="48" r="14"/>
                    <circle cx="66" cy="48" r="14"/>
                    <circle cx="42" cy="60" r="13"/>
                    <circle cx="58" cy="60" r="13"/>
                    <circle cx="50" cy="50" r="12" fill="#fffdf6"/>
                </g>
                <g fill="#6b8e5a">
                    <path d="M48 72 Q46 85 42 95 L50 95 Q52 85 50 72 Z"/>
                    <ellipse cx="38" cy="80" rx="8" ry="4" transform="rotate(-30 38 80)"/>
                </g>
            </svg>
        </div>

        <div id="text-block" class="text-block">
            <div id="nombre" class="nombre-text">Cargando...</div>
            <div id="subtitulo" class="subtitulo-text"></div>
            <div id="detalle" class="detalle-text"></div>
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtxIX6cZO_YWTxd2X0ElxK59rl1lCE7bjLzlO21aBzoXZFrMC2Vd3Yin8AolkYFKK0zKPRhA7dF0Rn/pub?output=csv";

        let listaRegistros = [];
        let indiceActual = 0;
        let estaMostrando = false;

        // --- CONFIGURACIÓN DE AUTOAJUSTE DE TAMAÑO ---
        // Ancho máximo del cuadro de texto dentro del lienzo de 1280 px
        // (1280 - 25 izquierda - 210 de foto - 25 de margen derecho = 1020, con un poco de seguridad)
        const ANCHO_MAXIMO_BLOQUE = 1000;
        // Si cambias un tamaño base, cámbialo también en el CSS (.nombre-text, .subtitulo-text, .detalle-text)
        const TAMANOS = {
            nombre:    { base: 24, min: 20 },
            subtitulo: { base: 19, min: 14 },
            detalle:   { base: 17, min: 14 }
        };
        const PASO_REDUCCION = 1; // px que baja en cada iteración

        // Mide el ancho real del texto de una línea
        function anchoTexto(el) {
            const anterior = el.style.display;
            el.style.display = "inline-block";
            const ancho = el.offsetWidth;
            el.style.display = anterior;
            return ancho;
        }

        // Reduce la letra de cada línea solo si esa línea no cabe
        function ajustarTamanoTexto() {
            const bloque = document.getElementById("text-block");
            const lineas = [
                { el: document.getElementById("nombre"),    cfg: TAMANOS.nombre },
                { el: document.getElementById("subtitulo"), cfg: TAMANOS.subtitulo },
                { el: document.getElementById("detalle"),   cfg: TAMANOS.detalle }
            ];

            // Estado inicial: una sola línea y tamaños base
            bloque.classList.remove("permitir-saltos");
            lineas.forEach(l => { l.el.style.fontSize = l.cfg.base + "px"; });

            // Espacio que ocupan el relleno y los bordes del bloque
            const cs = getComputedStyle(bloque);
            const extra = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
                        + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
            const disponible = ANCHO_MAXIMO_BLOQUE - extra;

            let algunaNoCabe = false;
            lineas.forEach(l => {
                let tamano = l.cfg.base;
                while (anchoTexto(l.el) > disponible && tamano > l.cfg.min) {
                    tamano -= PASO_REDUCCION;
                    l.el.style.fontSize = tamano + "px";
                }
                if (anchoTexto(l.el) > disponible) algunaNoCabe = true;
            });

            // Último recurso: permitir dos líneas para que nada se corte
            if (algunaNoCabe) {
                bloque.classList.add("permitir-saltos");
            }
        }

        // Espera a que carguen las fuentes (máximo 1.5 s) para medir bien el texto
        async function esperarFuentes() {
            try {
                if (document.fonts && document.fonts.load) {
                    await Promise.race([
                        Promise.all([
                            document.fonts.load("900 24px Montserrat"),
                            document.fonts.load("700 19px Montserrat"),
                            document.fonts.load("700 17px Montserrat")
                        ]),
                        new Promise(resolve => setTimeout(resolve, 1500))
                    ]);
                }
            } catch (error) {
                console.error("Error esperando fuentes:", error);
            }
        }

        function parseCSV(text) {
            const lines = text.replace(/\r/g, "").split("\n");
            const result = [];
            if (lines.length === 0) return [];

            const headers = lines[0].split(",").map(h => h.trim().toLowerCase());

            const titIdx = headers.indexOf("titulo") !== -1 ? headers.indexOf("titulo") : 0;
            const descIdx = headers.indexOf("descripción") !== -1 ? headers.indexOf("descripción") : (headers.indexOf("descripcion") !== -1 ? headers.indexOf("descripcion") : 1);
            const rot1Idx = headers.indexOf("rótulo1") !== -1 ? headers.indexOf("rótulo1") : (headers.indexOf("rotulo1") !== -1 ? headers.indexOf("rotulo1") : 2);
            const rot2Idx = headers.indexOf("rótulo2") !== -1 ? headers.indexOf("rótulo2") : (headers.indexOf("rotulo2") !== -1 ? headers.indexOf("rotulo2") : 3);
            const fotoIdx = headers.indexOf("foto") !== -1 ? headers.indexOf("foto") : 4;

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const currentline = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

                if (currentline[descIdx]) {
                    let titulo = currentline[titIdx] ? currentline[titIdx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let descripcion = currentline[descIdx] ? currentline[descIdx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let rotulo1 = currentline[rot1Idx] ? currentline[rot1Idx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let rotulo2 = currentline[rot2Idx] ? currentline[rot2Idx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let foto = currentline[fotoIdx] ? currentline[fotoIdx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";

                    if (descripcion && descripcion.toLowerCase() !== "descripción" && descripcion.toLowerCase() !== "descripcion") {
                        result.push({ titulo, descripcion, rotulo1, rotulo2, foto });
                    }
                }
            }
            return result;
        }

        async function cargarDatos() {
            try {
                const response = await fetch(`${csvUrl}&nocache=${new Date().getTime()}`);
                const dataText = await response.text();
                const nuevosDatos = parseCSV(dataText);
                if (nuevosDatos.length > 0) listaRegistros = nuevosDatos;
            } catch (error) {
                console.error("Error cargando base de datos:", error);
            }
        }

        async function ejecutarCicloVisual() {
            if (listaRegistros.length === 0 || estaMostrando) return;

            estaMostrando = true;
            const container = document.getElementById("widget-container");
            const foto = document.getElementById("person-photo");
            const nombre = document.getElementById("nombre");
            const subtitulo = document.getElementById("subtitulo");
            const detalle = document.getElementById("detalle");

            const itemActual = listaRegistros[indiceActual];

            nombre.innerText = itemActual.descripcion;
            subtitulo.innerText = itemActual.titulo;

            let combinacionDetalle = "";
            if (itemActual.rotulo1 && itemActual.rotulo2) {
                combinacionDetalle = `${itemActual.rotulo1} • ${itemActual.rotulo2}`;
            } else if (itemActual.rotulo1) {
                combinacionDetalle = itemActual.rotulo1;
            } else if (itemActual.rotulo2) {
                combinacionDetalle = itemActual.rotulo2;
            }
            detalle.innerText = combinacionDetalle;

            foto.src = itemActual.foto || "";

            indiceActual = (indiceActual + 1) % listaRegistros.length;

            // Mide con las fuentes ya cargadas y ajusta el texto antes de mostrar la tarjeta
            await esperarFuentes();
            ajustarTamanoTexto();

            container.classList.add("visible");

            setTimeout(() => {
                container.classList.remove("visible");
            }, 13000);

            setTimeout(() => {
                estaMostrando = false;
            }, 14000);
        }

        async function iniciar() {
            await cargarDatos();
            if (listaRegistros.length > 0) ejecutarCicloVisual();

            setInterval(ejecutarCicloVisual, 60000);
            setInterval(cargarDatos, 120000);
        }

        window.onload = iniciar;
    </script>
</body>
</html>
