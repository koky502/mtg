<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Memorial MTG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #widget-container {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            align-items: flex-end;
            transform: scale(0.9) translateY(30px);
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #widget-container.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* MARCO DE LA FOTO */
        .photo-frame {
            position: relative;
            width: 150px;
            height: 190px;
            border-radius: 10px 10px 4px 4px;
            overflow: visible;
            flex-shrink: 0;
            z-index: 2;
        }

        .photo-inner {
            width: 100%;
            height: 100%;
            border-radius: 10px 10px 4px 4px;
            overflow: hidden;
            border: 3px solid #e6ca65;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            background: #111;
        }

        .photo-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        /* CINTA DE LUTO (esquina superior de la foto) */
        .cinta-luto {
            position: absolute;
            top: -8px;
            left: 14px;
            width: 26px;
            z-index: 3;
        }

        .cinta-luto .lazo {
            width: 26px;
            height: 26px;
            background: #0a0a0a;
            border-radius: 50%;
            border: 2px solid #e6ca65;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
        }

        .cinta-luto .cola {
            position: absolute;
            top: 20px;
            left: 2px;
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 32px solid #0a0a0a;
        }

        .cinta-luto .cola::after {
            content: '';
            position: absolute;
            top: -32px;
            left: -9px;
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 26px solid transparent;
        }

        /* ROSA BLANCA DECORATIVA (esquina inferior de la foto) */
        .rosa-decorativa {
            position: absolute;
            bottom: -16px;
            left: -16px;
            width: 54px;
            height: 54px;
            z-index: 4;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        /* BLOQUE DE TEXTO */
        .text-block {
            background: rgba(0, 0, 0, 0.88);
            border-top: 2.5px solid #e6ca65;
            border-right: 5px solid #e6ca65;
            border-bottom: 2.5px solid #e6ca65;
            border-radius: 0 10px 10px 0;
            padding: 18px 30px 18px 34px;
            margin-left: -10px;
            margin-bottom: 8px;
            max-width: 480px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .nombre-text {
            color: #E6CA65;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.25;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.7);
            margin-bottom: 4px;
        }

        .subtitulo-text {
            color: #FFF3B3;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1.3;
            text-shadow: 0 2px 3px rgba(0,0,0,0.9);
            margin-bottom: 6px;
        }

        .detalle-text {
            color: #cfc49a;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        /* Marca MTG pequeña, esquina del bloque de texto */
        .marca-mtg {
            position: absolute;
            top: 8px;
            right: 12px;
            color: #b8860b;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <div class="photo-frame">
            <div class="photo-inner">
                <img id="person-photo" src="" alt="">
            </div>
            <div class="cinta-luto">
                <div class="lazo"></div>
                <div class="cola"></div>
            </div>
            <svg class="rosa-decorativa" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <g fill="#f5f0e6" stroke="#d8cfa8" stroke-width="1.5">
                    <circle cx="50" cy="35" r="16"/>
                    <circle cx="34" cy="48" r="14"/>
                    <circle cx="66" cy="48" r="14"/>
                    <circle cx="42" cy="60" r="13"/>
                    <circle cx="58" cy="60" r="13"/>
                    <circle cx="50" cy="50" r="12" fill="#fffdf6"/>
                </g>
                <g fill="#6b8e5a">
                    <path d="M48 72 Q46 85 42 95 L50 95 Q52 85 50 72 Z"/>
                    <ellipse cx="38" cy="80" rx="8" ry="4" transform="rotate(-30 38 80)"/>
                </g>
            </svg>
        </div>

        <div class="text-block">
            <div class="marca-mtg">MTG</div>
            <div id="nombre" class="nombre-text">Cargando...</div>
            <div id="subtitulo" class="subtitulo-text"></div>
            <div id="detalle" class="detalle-text"></div>
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtxIX6cZO_YWTxd2X0ElxK59rl1lCE7bjLzlO21aBzoXZFrMC2Vd3Yin8AolkYFKK0zKPRhA7dF0Rn/pub?output=csv";

        let listaRegistros = [];
        let indiceActual = 0;
        let estaMostrando = false;

        function parseCSV(text) {
            const lines = text.replace(/\r/g, "").split("\n");
            const result = [];
            if (lines.length === 0) return [];

            const headers = lines[0].split(",").map(h => h.trim().toLowerCase());

            const titIdx = headers.indexOf("titulo") !== -1 ? headers.indexOf("titulo") : 0;
            const descIdx = headers.indexOf("descripción") !== -1 ? headers.indexOf("descripción") : (headers.indexOf("descripcion") !== -1 ? headers.indexOf("descripcion") : 1);
            const rot1Idx = headers.indexOf("rótulo1") !== -1 ? headers.indexOf("rótulo1") : (headers.indexOf("rotulo1") !== -1 ? headers.indexOf("rotulo1") : 2);
            const rot2Idx = headers.indexOf("rótulo2") !== -1 ? headers.indexOf("rótulo2") : (headers.indexOf("rotulo2") !== -1 ? headers.indexOf("rotulo2") : 3);
            const fotoIdx = headers.indexOf("foto") !== -1 ? headers.indexOf("foto") : 4;

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const currentline = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

                if (currentline[descIdx]) {
                    let titulo = currentline[titIdx] ? currentline[titIdx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let descripcion = currentline[descIdx] ? currentline[descIdx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let rotulo1 = currentline[rot1Idx] ? currentline[rot1Idx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let rotulo2 = currentline[rot2Idx] ? currentline[rot2Idx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let foto = currentline[fotoIdx] ? currentline[fotoIdx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";

                    if (descripcion && descripcion.toLowerCase() !== "descripción" && descripcion.toLowerCase() !== "descripcion") {
                        result.push({ titulo, descripcion, rotulo1, rotulo2, foto });
                    }
                }
            }
            return result;
        }

        async function cargarDatos() {
            try {
                const response = await fetch(`${csvUrl}&nocache=${new Date().getTime()}`);
                const dataText = await response.text();
                const nuevosDatos = parseCSV(dataText);
                if (nuevosDatos.length > 0) listaRegistros = nuevosDatos;
            } catch (error) {
                console.error("Error cargando base de datos:", error);
            }
        }

        function ejecutarCicloVisual() {
            if (listaRegistros.length === 0 || estaMostrando) return;

            estaMostrando = true;
            const container = document.getElementById("widget-container");
            const foto = document.getElementById("person-photo");
            const nombre = document.getElementById("nombre");
            const subtitulo = document.getElementById("subtitulo");
            const detalle = document.getElementById("detalle");

            const itemActual = listaRegistros[indiceActual];

            nombre.innerText = itemActual.descripcion;
            subtitulo.innerText = itemActual.titulo;

            let combinacionDetalle = "";
            if (itemActual.rotulo1 && itemActual.rotulo2) {
                combinacionDetalle = `${itemActual.rotulo1} • ${itemActual.rotulo2}`;
            } else if (itemActual.rotulo1) {
                combinacionDetalle = itemActual.rotulo1;
            } else if (itemActual.rotulo2) {
                combinacionDetalle = itemActual.rotulo2;
            }
            detalle.innerText = combinacionDetalle;

            foto.src = itemActual.foto || "";

            indiceActual = (indiceActual + 1) % listaRegistros.length;

            // Entrada
            container.classList.add("visible");

            // Salida tras 13 segundos visible
            setTimeout(() => {
                container.classList.remove("visible");
            }, 13000);

            // Reinicio del ciclo
            setTimeout(() => {
                estaMostrando = false;
            }, 14000);
        }

        async function iniciar() {
            await cargarDatos();
            if (listaRegistros.length > 0) ejecutarCicloVisual();

            setInterval(ejecutarCicloVisual, 60000);
            setInterval(cargarDatos, 120000);
        }

        window.onload = iniciar;
    </script>
</body>
</html>
