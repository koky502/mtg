<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Memorial MTG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #widget-container {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            align-items: flex-end;
            transform: scale(0.9) translateY(30px);
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #widget-container.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* MARCO DE LA FOTO */
        .photo-frame {
            position: relative;
            width: 165px;
            height: 205px;
            border-radius: 10px 10px 4px 4px;
            overflow: visible;
            flex-shrink: 0;
            z-index: 2;
        }

        .photo-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 10px 10px 4px 4px;
            overflow: hidden;
            border: 3px solid #e6ca65;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            background: #111;
        }

        .photo-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        /* Viñeta oscura para fundir la foto con el marco */
        .photo-inner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
            pointer-events: none;
        }

        /* CINTA DE LUTO (esquina superior de la foto) */
        .cinta-luto {
            position: absolute;
            top: -8px;
            left: 4px;
            width: 26px;
            z-index: 3;
        }

        .cinta-luto .lazo {
            width: 26px;
            height: 26px;
            background: #0a0a0a;
            border-radius: 50%;
            border: 3px solid #e6ca65;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
        }

        .cinta-luto .cola {
            position: absolute;
            top: 20px;
            left: 2px;
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 32px solid #0a0a0a;
        }

        .cinta-luto .cola::after {
            content: '';
            position: absolute;
            top: -32px;
            left: -9px;
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 26px solid transparent;
        }

        /* ROSA BLANCA DECORATIVA (esquina inferior de la foto) */
        .rosa-decorativa {
            position: absolute;
            bottom: -16px;
            left: -16px;
            width: 54px;
            height: 54px;
            z-index: 4;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
            background: radial-gradient(circle, rgba(0,0,0,0.5) 40%, transparent 70%);
            border-radius: 50%;
        }

        /* BLOQUE DE TEXTO */
        .text-block {
            background: rgba(0, 0, 0, 0.88);
            border-top: 2.5px solid #e6ca65;
            border-right: 5px solid #e6ca65;
            border-bottom: 2.5px solid #e6ca65;
            border-radius: 0 10px 10px 0;
            padding: 18px 30px 18px 34px;
            margin-left: -10px;
            margin-bottom: 8px;
            max-width: 480px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .nombre-text {
            color: #E6CA65;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.25;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.7);
            margin-bottom: 4px;
        }

        .subtitulo-text {
            color: #FFF3B3;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1.3;
            text-shadow: 0 2px 3px rgba(0,0,0,0.9);
            margin-bottom: 6px;
        }

        .detalle-text {
            color: #cfc49a;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        /* Marca MTG pequeña, esquina del bloque de texto */
        .marca-mtg {
            position: absolute;
            top: 8px;
            right: 12px;
            color: #b8860b;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <div class="photo-frame">
            <div class="photo-inner">
                <img id="person-photo" src="" alt="">
            </div>
            <div class="cinta-luto">
                <div class="lazo"></div>
                <div class="cola"></div>
            </div>
            <svg class="rosa-decorativa" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <g fill="#f5f0e6" stroke="#d8cfa8" stroke-width="1.5">
                    <circle cx="50" cy="35" r="16"/>
