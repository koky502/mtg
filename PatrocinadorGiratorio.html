<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower Third Premium Oro Puro - MTG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #widget-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            height: 120px; 
        }

        /* BOTÓN REDONDO DE PLAY CORPORATIVO CON FLIP 3D */
        .play-button {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #b8860b 0%, #e6ca65 50%, #996515 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            z-index: 10;
            border: 3.5px solid #0a0a0a;
            transform: scale(0);
            perspective: 1000px;
        }

        /* CONTENEDOR INTERNO DE CONTENIDO (PLAY vs MTG) */
        .badge-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* TRIÁNGULO DE PLAY */
        .triangle {
            width: 0;
            height: 0;
            border-top: 16px solid transparent;
            border-left: 28px solid #000000;
            border-bottom: 16px solid transparent;
            margin-left: 10px;
            transition: opacity 0.3s;
        }

        /* TEXTO MARCA MTG */
        .brand-text {
            position: absolute;
            color: #000000;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 1px 1px rgba(255,255,255,0.3);
        }

        /* CLASE PARA EFECTUAR EL CAMBIO A MTG */
        .badge-content.mostrar-marca {
            transform: rotateY(180deg);
        }

        .badge-content.mostrar-marca .triangle {
            opacity: 0;
        }

        .badge-content.mostrar-marca .brand-text {
            opacity: 1;
            transform: rotateY(180deg); /* Corrige el texto para que no quede en espejo */
        }

        /* CONTENEDOR PRINCIPAL */
        .banner-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-left: -45px;
            padding-left: 65px; 
            padding-right: 45px;
            height: 100px; 
            background: rgba(0, 0, 0, 0.82);
            border-top: 2.5px solid #e6ca65;
            border-right: 5px solid #e6ca65; 
            border-bottom: 2.5px solid #e6ca65;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            z-index: 5;
            transform: scaleX(0);
            transform-origin: left;
            white-space: nowrap;
            gap: 2px;
        }

        /* LÍNEA 1: Título */
        .sub-label {
            color: #FFF3B3; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase;
            letter-spacing: 3.5px; 
            line-height: 1.2;
            text-shadow: 0 2px 3px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.5);
        }

        /* LÍNEA 2: Descripción */
        .main-text {
            color: #e6ca65; 
            font-size: 24px; 
            font-weight: 900; 
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 6px rgba(0,0,0,0.6); 
        }

        /* LÍNEA 3: Rótulo1 + Rótulo2 */
        .phone-text {
            color: #FFF3B3;
            font-size: 14px; 
            font-weight: 700;
            letter-spacing: 1.5px; 
            line-height: 1.2;
            text-shadow: 0 2px 3px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.5);
        }

        /* ANIMACIONES DE TRIGGER */
        .animar-play-entrada { animation: entradaPlay 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animar-play-salida  { animation: salidaPlay 0.5s ease forwards; }
        
        .animar-banner-entrada { animation: entradaBanner 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
        .animar-banner-salida  { animation: salidaBanner 0.4s ease forwards; }

        @keyframes entradaPlay {
            0% { transform: scale(0) rotate(-180deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        @keyframes salidaPlay {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes entradaBanner {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }
        @keyframes salidaBanner {
            0% { transform: scaleX(1); opacity: 1; }
            100% { transform: scaleX(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <div id="play-btn" class="play-button">
            <div id="badge-inner" class="badge-content">
                <div class="triangle"></div>
                <div class="brand-text">MTG</div>
            </div>
        </div>
        
        <div id="banner" class="banner-wrapper">
            <div id="sponsor-titulo" class="sub-label">Cargando...</div>
            <div id="sponsor-desc" class="main-text"></div>
            <div id="sponsor-rotulos" class="phone-text"></div>
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtxIX6cZO_YWTxd2X0ElxK59rl1lCE7bjLzlO21aBzoXZFrMC2Vd3Yin8AolkYFKK0zKPRhA7dF0Rn/pub?output=csv";
        
        let listaRegistros = [];
        let indiceActual = 0;
        let estaMostrando = false;

        function parseCSV(text) {
            const lines = text.replace(/\r/g, "").split("\n");
            const result = [];
            if (lines.length === 0) return [];

            const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
            
            const titIdx = headers.indexOf("titulo") !== -1 ? headers.indexOf("titulo") : 0;
            const descIdx = headers.indexOf("descripción") !== -1 ? headers.indexOf("descripción") : (headers.indexOf("descripcion") !== -1 ? headers.indexOf("descripcion") : 1);
            const rot1Idx = headers.indexOf("rótulo1") !== -1 ? headers.indexOf("rótulo1") : (headers.indexOf("rotulo1") !== -1 ? headers.indexOf("rotulo1") : 2);
            const rot2Idx = headers.indexOf("rótulo2") !== -1 ? headers.indexOf("rótulo2") : (headers.indexOf("rotulo2") !== -1 ? headers.indexOf("rotulo2") : 3);

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const currentline = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (currentline[descIdx]) {
                    let titulo = currentline[titIdx] ? currentline[titIdx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let descripcion = currentline[descIdx] ? currentline[descIdx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let rotulo1 = currentline[rot1Idx] ? currentline[rot1Idx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";
                    let rotulo2 = currentline[rot2Idx] ? currentline[rot2Idx].replace(/^"+|"+$/g, '').replace(/""/g, '"').trim() : "";

                    if (descripcion && descripcion.toLowerCase() !== "descripción" && descripcion.toLowerCase() !== "descripcion") {
                        result.push({ 
                            titulo: titulo,
                            descripcion: descripcion, 
                            rotulo1: rotulo1,
                            rotulo2: rotulo2
                        });
                    }
                }
            }
            return result;
        }

        async function cargarDatos() {
            try {
                const response = await fetch(`${csvUrl}&nocache=${new Date().getTime()}`);
                const dataText = await response.text();
                const nuevosDatos = parseCSV(dataText);
                if (nuevosDatos.length > 0) listaRegistros = nuevosDatos;
            } catch (error) {
                console.error("Error cargando base de datos:", error);
            }
        }

        function ejecutarCicloVisual() {
            if (listaRegistros.length === 0 || estaMostrando) return;
            
            estaMostrando = true;
            const btn = document.getElementById("play-btn");
            const innerBadge = document.getElementById("badge-inner");
            const banner = document.getElementById("banner");
            const txtTitulo = document.getElementById("sponsor-titulo");
            const txtDesc = document.getElementById("sponsor-desc");
            const txtRotulos = document.getElementById("sponsor-rotulos");

            // Resetear estado del badge a Play
            innerBadge.className = "badge-content";

            const itemActual = listaRegistros[indiceActual];
            txtTitulo.innerText = itemActual.titulo;
            txtDesc.innerText = itemActual.descripcion;

            let combinacionRotulos = "";
            if (itemActual.rotulo1 && itemActual.rotulo2) {
                combinacionRotulos = `${itemActual.rotulo1} ${itemActual.rotulo2}`;
            } else if (itemActual.rotulo1) {
                combinacionRotulos = itemActual.rotulo1;
            } else if (itemActual.rotulo2) {
                combinacionRotulos = itemActual.rotulo2;
            }

            txtRotulos.innerText = combinacionRotulos;

            indiceActual = (indiceActual + 1) % listaRegistros.length;

            // t=0s: Entra el botón con animación giratoria
            btn.className = "play-button animar-play-entrada";

            // t=0.5s: Se abre el banner
            setTimeout(() => {
                banner.className = "banner-wrapper animar-banner-entrada";
            }, 500);

            // t=4.0s: El circulo gira en 3D (flip) y revela "MTG"
            setTimeout(() => {
                innerBadge.className = "badge-content mostrar-marca";
            }, 4000);

            // t=12.5s: Se oculta el banner
            setTimeout(() => {
                banner.className = "banner-wrapper animar-banner-salida";
            }, 12500);

            // t=13.0s: El botón desaparece
            setTimeout(() => {
                btn.className = "play-button animar-play-salida";
            }, 13000);

            // t=14.0s: Reinicia candado
            setTimeout(() => {
                estaMostrando = false;
            }, 14000);
        }

        async function iniciar() {
            await cargarDatos();
            if (listaRegistros.length > 0) ejecutarCicloVisual();
            
            setInterval(ejecutarCicloVisual, 60000); 
            setInterval(cargarDatos, 120000);
        }

        window.onload = iniciar;
    </script>
</body>
</html>
